name: API - Dog API (RestAssured)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      groups:
        description: 'Tag JUnit para filtrar (smoke, regression, contract, exception, alternative)'
        default: 'regression'

# Em PR roda só smoke; em push/manual roda a tag escolhida (padrão regression).
env:
  GROUPS: ${{ github.event.inputs.groups || (github.event_name == 'pull_request' && 'smoke' || 'regression') }}

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Executar testes (grupo ${{ env.GROUPS }})
        run: mvn -B test -Dgroups=${{ env.GROUPS }}

      - name: Gerar relatório HTML
        if: always()
        run: mvn -B surefire-report:report-only -DshowSuccess=true

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dog-api-reports
          path: |
            target/surefire-reports/
            target/reports/surefire.html
          retention-days: 14
